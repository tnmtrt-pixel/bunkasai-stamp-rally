<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スタンプラリー QR表示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
/* Layout: 教室に置く画面。中央に大きなQR、上に教室名、下に残り時間のバー */
:root{
  --paper:#eef2f4; --card:#ffffff; --ink:#1d2a3a; --muted:#5e6c7b;
  --line:#c9d3db; --shu:#d8432e; --ai:#26457a;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP","Noto Sans CJK JP",sans-serif;
  --body:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Meiryo",sans-serif;
}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.screen{min-height:100%;display:grid;place-items:center;padding-block:20px;box-sizing:border-box}
.setup{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:400px;display:grid;gap:14px;box-sizing:border-box}
.setup h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0;color:var(--ai)}
.setup p{margin:0;font-size:13px;color:var(--muted)}
label{font-size:13px;font-weight:700;display:grid;gap:6px}
select,input{font:inherit;font-size:18px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
button{font:inherit;font-weight:700;font-size:16px;padding:12px;border-radius:10px;border:0;background:var(--ai);color:#fff;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--shu);outline-offset:2px}
.err{color:var(--shu);font-size:13px;font-weight:700;min-height:1.3em}
.show{display:grid;justify-items:center;gap:16px;text-align:center;width:100%}
.room{font-family:var(--display);font-size:clamp(40px,9vw,96px);line-height:1;color:var(--ai)}
.sub{font-size:clamp(14px,2.4vw,22px);font-weight:700}
.qrbox{background:#fff;padding:18px;border-radius:16px;border:4px solid var(--shu);line-height:0}
#qr img,#qr canvas{width:min(62vh,78vw)!important;height:auto!important;max-width:520px;image-rendering:pixelated}
.timer{width:min(62vh,78vw);max-width:556px;height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.timer span{display:block;height:100%;background:var(--shu)}
.foot{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted)}
.foot button{font-size:12px;padding:6px 10px;background:none;color:var(--muted);border:1px solid var(--line)}
.url{font-size:11px;color:var(--muted);word-break:break-all;max-width:556px}
.qrwrap{position:relative;display:grid;justify-items:center;gap:16px}
.qcover{position:absolute;inset:-6px;background:var(--card);border:4px dashed var(--line);border-radius:18px;display:grid;place-content:center;justify-items:center;gap:14px;padding:20px}
.qcover p{margin:0;font-size:clamp(15px,2.6vw,22px);font-weight:700;color:var(--ink)}
.qcover button{font-size:clamp(18px,3.2vw,28px);padding:16px 28px;background:var(--shu)}
.rmsg{font-size:clamp(14px,2.4vw,20px);font-weight:700;color:var(--shu);min-height:1.4em}
.warn{background:var(--shu);color:#fff;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="screen">
  <form class="setup" id="setup" autocomplete="off">
    <h1>QR表示の準備</h1>
    <p>この画面を出し物の場所に置くPCやタブレットで開き、場所を選んで係用番号を入力してください。</p>
    <label>場所<select id="room"></select></label>
    <label>係用番号<input id="pin" type="password" inputmode="numeric" maxlength="4"></label>
    <div class="err" id="err" role="status"></div>
    <button type="submit">QRを表示する</button>
  </form>

  <div class="show" id="show" hidden>
    <div class="sub">出し物を体験した人は、QRを読み取ってスタンプGET</div>
    <div class="room" id="rname"></div>
    <div class="qrwrap">
      <div class="qrbox"><div id="qr"></div></div>
      <div class="timer"><span id="bar"></span></div>
      <div class="qcover" id="qcover"><p>体験が終わった人に、係の人が表示します</p><button type="button" id="reveal">QRを表示する</button></div>
    </div>
    <div class="rmsg" id="rmsg" aria-live="polite"></div>
    <div class="warn" id="warn" hidden></div>
    <div class="foot">
      <span>QRは<span id="step"></span>秒ごとに切り替わります</span>
      <button type="button" id="full">全画面</button>
      <button type="button" id="back">場所を変える</button>
    </div>
    <div class="url" id="url" hidden></div>
    <div class="url" id="diag"></div>
  </div>
</div>

<script src="qrcode.js?v=20261106b"></script><!-- QRコード作成（サイト内に置いて、外部サイトの読み込みに頼らない） -->
<script src="config.js?v=20261106b"></script>
<script>
const $=id=>document.getElementById(id);
const VERSION="20261106b";
// 思わぬエラーが起きたら画面に出す（スクリーンショットで原因がわかるように）
let lastErr="";
addEventListener("error",e=>{lastErr=String(e.message||e.error||"");showDiag()});
addEventListener("unhandledrejection",e=>{lastErr=String(e.reason&&e.reason.message||e.reason||"");showDiag()});
function showDiag(){const d=document.getElementById("diag");if(d)d.textContent=`版 ${VERSION}`+(lastErr?` ／ エラー: ${lastErr}`:"")}
const base=new URL("index.html",location.href).href;
RALLY.spots.forEach(s=>{const o=document.createElement("option");o.value=s.id;o.textContent=s.name;$("room").appendChild(o)});
try{const r=localStorage.getItem("rally-display-room");if(r)$("room").value=r}catch(e){}
$("step").textContent=RALLY.step;
let spot=null,lastW=null,wake=null,qr=null,hideAt=0;
const SHOW=RALLY.reveal||20;  // QRを表示しておく秒数
$("reveal").onclick=()=>{hideAt=Date.now()+SHOW*1000;lastW=null;tick()};  // 押したらすぐ描き直して表示

$("setup").addEventListener("submit",async e=>{
  e.preventDefault();
  const s=RALLY.spots.find(x=>String(x.id)===$("room").value);
  let ok=false;try{ok=await RALLY.checkPin(s,$("pin").value.trim())}catch(err){$("err").textContent="このブラウザでは動きません。https のページで開いてください";return}
  if(!ok){$("err").textContent="係用番号が違います";$("pin").value="";return}
  try{localStorage.setItem("rally-display-room",s.id)}catch(e){}
  spot=s;$("pin").value="";$("err").textContent="";
  $("setup").hidden=true;$("show").hidden=false;$("rname").textContent=s.name;
  if(!/^https:/.test(base)){$("warn").hidden=false;$("warn").textContent="このページは https で公開した場所から開いてください（今のままではスマホで読み取れません）"}
  lastW=null;tick();keepAwake();
});
$("back").onclick=()=>{spot=null;hideAt=0;$("show").hidden=true;$("setup").hidden=false};
$("full").onclick=()=>{const d=document.documentElement;(d.requestFullscreen?d.requestFullscreen():Promise.reject()).catch(()=>{})};

// QRを canvas に描く（白い余白つき）。失敗したら理由を画面に出す
function drawQR(text){
  const box=$("qr");
  try{
    const q=qrcode(0,"M");q.addData(text);q.make();
    const n=q.getModuleCount(),quiet=4,size=600,cell=Math.floor(size/(n+quiet*2)),dim=cell*(n+quiet*2);
    const cv=document.createElement("canvas");cv.width=cv.height=dim;
    const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,dim,dim);g.fillStyle="#000";
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))g.fillRect((c+quiet)*cell,(r+quiet)*cell,cell,cell);
    cv.setAttribute("role","img");cv.setAttribute("aria-label","スタンプ用のQRコード");
    box.innerHTML="";box.appendChild(cv);
  }catch(e){
    box.innerHTML='<p style="line-height:1.6;font-size:16px;color:#d8432e;padding:20px">QRコードを作れませんでした。<br>ページを再読み込みしてください。<br>直らないときは、来場者のスマホで台紙の枠をタップし、係用番号で押してください。</p>';
  }
}
let lastTick=0,ticking=false;
async function tick(){
  if(!spot||ticking)return;
  ticking=true;
  try{await tickBody()}catch(e){lastErr=String(e&&e.message||e);showDiag()}
  ticking=false;lastTick=Date.now();
  clearTimeout(tick.t);tick.t=setTimeout(tick,250);
}
// 画面の更新が止まっていたら（スリープ明けなど）、自動で再開する
setInterval(()=>{if(spot&&!ticking&&Date.now()-lastTick>2000){lastW=null;tick()}},1000);
async function tickBody(){
  const now=Date.now(),w=RALLY.win(now);
  if(w!==lastW){
    let c="";
    try{c=await RALLY.code(spot,w)}catch(e){lastErr="暗号の計算ができません（https で開いてください）";showDiag();return}
    lastW=w;
    const url=`${base}?s=${spot.id}&w=${w}&c=${c}`;
    drawQR(url);
    $("url").textContent=url;
  }
  const open=now<hideAt;$("qcover").hidden=open;
  $("rmsg").textContent=open?`あと${Math.ceil((hideAt-now)/1000)}秒で隠れます`:"";
  const left=1-((now/1000)%RALLY.step)/RALLY.step;
  $("bar").style.width=(left*100)+"%";
}
async function keepAwake(){
  try{wake=await navigator.wakeLock.request("screen")}catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&spot){keepAwake();lastW=null;tick()}});
showDiag();

// 見出し用フォント（Dela Gothic One）は、このページで使う文字だけを1ファイルで読み込む。
// 日本語フォントの小分け読み込みで、文字ごとにフォントが混ざって崩れるのを防ぐ。
function loadDisplayFont(extra){
  try{
    let t=[...document.querySelectorAll(".setup h1,.room")].map(e=>e.textContent).join("")+(extra||"")+"0123456789:/〜～-月日年達成受取済！";
    t=[...new Set(t.replace(/\s/g,""))].join("");
    const l=document.createElement("link");l.rel="stylesheet";
    l.href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=block&text="+encodeURIComponent(t);
    document.head.appendChild(l);
  }catch(e){}
}
loadDisplayFont(RALLY.spots.map(x=>x.name).join("")+"QR表示の準備");
</script>
</body>
</html>
